<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/contract.png" type="image/x-icon" />
    <title>Conversor de Texto - camelCase</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
        width: 100%;
      }

      h1 {
        color: #333;
        text-align: center;
        margin-bottom: 10px;
        font-size: 28px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .input-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
      }

      textarea {
        width: 100%;
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        font-family: inherit;
        resize: vertical;
        transition: border-color 0.3s;
      }

      textarea:focus {
        outline: none;
        border-color: #667eea;
      }

      #textoOriginal {
        min-height: 120px;
      }

      #textoConvertido {
        min-height: 120px;
        background-color: #f8f9fa;
      }

      button {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        margin-bottom: 15px;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      .btn-copiar {
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      }

      .btn-copiar:hover {
        box-shadow: 0 5px 20px rgba(56, 239, 125, 0.4);
      }

      .exemplo {
        background-color: #f0f4ff;
        padding: 15px;
        border-radius: 10px;
        margin-top: 20px;
      }

      .exemplo h3 {
        color: #667eea;
        font-size: 16px;
        margin-bottom: 10px;
      }

      .exemplo p {
        color: #555;
        font-size: 14px;
        margin: 5px 0;
      }

      .exemplo code {
        background-color: #e8ecff;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: "Courier New", monospace;
      }

      .mensagem {
        text-align: center;
        padding: 10px;
        border-radius: 8px;
        margin-top: 15px;
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .mensagem.show {
        opacity: 1;
      }

      .mensagem.sucesso {
        background-color: #d4edda;
        color: #155724;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔄 Conversor de Texto</h1>
      <p class="subtitle">Converte frases para formato camelCase</p>

      <div class="input-group">
        <label for="textoOriginal">Digite o texto:</label>
        <textarea
          id="textoOriginal"
          placeholder="Digite aqui a frase que deseja converter..."
        ></textarea>
      </div>

      <button onclick="converterTexto()">Converter para camelCase</button>

      <div class="input-group">
        <label for="textoConvertido">Texto convertido:</label>
        <textarea
          id="textoConvertido"
          readonly
          placeholder="O resultado aparecerá aqui..."
        ></textarea>
      </div>

      <button class="btn-copiar" onclick="copiarTexto()">
        📋 Copiar Texto
      </button>

      <div id="mensagem" class="mensagem"></div>

      <div class="exemplo">
        <h3>📝 Exemplos:</h3>
        <p><strong>Entrada:</strong> Olá Mundo Este É Um Teste</p>
        <p><strong>Saída:</strong> <code>olaMundoEsteEUmTeste</code></p>
        <br />
        <p><strong>Entrada:</strong> Meu-Nome-Completo Com Acentuação</p>
        <p><strong>Saída:</strong> <code>meuNomeCompletoComAcentuacao</code></p>
      </div>
    </div>

    <script>
      function removerAcentos(texto) {
        // Mapeia caracteres acentuados para suas versões sem acento
        const mapaAcentos = {
          á: "a",
          à: "a",
          ã: "a",
          â: "a",
          ä: "a",
          é: "e",
          è: "e",
          ê: "e",
          ë: "e",
          í: "i",
          ì: "i",
          î: "i",
          ï: "i",
          ó: "o",
          ò: "o",
          õ: "o",
          ô: "o",
          ö: "o",
          ú: "u",
          ù: "u",
          û: "u",
          ü: "u",
          ç: "c",
          ñ: "n",
          Á: "A",
          À: "A",
          Ã: "A",
          Â: "A",
          Ä: "A",
          É: "E",
          È: "E",
          Ê: "E",
          Ë: "E",
          Í: "I",
          Ì: "I",
          Î: "I",
          Ï: "I",
          Ó: "O",
          Ò: "O",
          Õ: "O",
          Ô: "O",
          Ö: "O",
          Ú: "U",
          Ù: "U",
          Û: "U",
          Ü: "U",
          Ç: "C",
          Ñ: "N",
        };

        // Substitui cada caractere acentuado
        return texto
          .split("")
          .map((char) => mapaAcentos[char] || char)
          .join("");
      }

      function converterTexto() {
        // Pega o texto digitado pelo usuário
        const textoOriginal = document.getElementById("textoOriginal").value;

        // Verifica se o campo está vazio
        if (textoOriginal.trim() === "") {
          mostrarMensagem("Por favor, digite algum texto!", false);
          return;
        }

        // Remove acentos do texto
        let textoSemAcentos = removerAcentos(textoOriginal);

        // Remove hífens e substitui por espaços para separar palavras
        textoSemAcentos = textoSemAcentos.replace(/-/g, " ");

        // Remove espaços extras e divide o texto em palavras
        const palavras = textoSemAcentos.trim().split(/\s+/);

        // Converte para camelCase
        let textoCamelCase = "";

        for (let i = 0; i < palavras.length; i++) {
          const palavra = palavras[i];

          if (i === 0) {
            // Primeira palavra: toda em minúscula
            textoCamelCase += palavra.toLowerCase();
          } else {
            // Demais palavras: primeira letra maiúscula, resto minúsculo
            textoCamelCase +=
              palavra.charAt(0).toUpperCase() + palavra.slice(1).toLowerCase();
          }
        }

        // Mostra o resultado
        document.getElementById("textoConvertido").value = textoCamelCase;
        mostrarMensagem("✅ Texto convertido com sucesso!", true);
      }

      function copiarTexto() {
        const textoConvertido = document.getElementById("textoConvertido");

        if (textoConvertido.value === "") {
          mostrarMensagem("Não há texto para copiar!", false);
          return;
        }

        // Copia o texto
        textoConvertido.select();
        document.execCommand("copy");

        mostrarMensagem("📋 Texto copiado para a área de transferência!", true);
      }

      function mostrarMensagem(texto, sucesso) {
        const mensagem = document.getElementById("mensagem");
        mensagem.textContent = texto;
        mensagem.className = "mensagem show " + (sucesso ? "sucesso" : "");

        // Remove a mensagem após 3 segundos
        setTimeout(() => {
          mensagem.classList.remove("show");
        }, 3000);
      }

      // Permite converter apertando Enter (com Ctrl)
      document
        .getElementById("textoOriginal")
        .addEventListener("keydown", function (event) {
          if (event.ctrlKey && event.key === "Enter") {
            converterTexto();
          }
        });
    </script>
  </body>
</html>
