<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listas</title>
  </head>
  <body>
    <h2>Listas</h2>
    <p>Lista ordenada</p>
    <ol type="1" start="3">
      <li>colocar o chocolate</li>
      <li>colocar a farinha</li>
      <li>colocar o açucar</li>
      <li>colocar o leite</li>
    </ol>

    <p>Lista não ordenada</p>
    <ul type="square">
      <li>comprar café</li>
      <li>comprar pão</li>
      <li>
        comprar produtos de limpeza
        <ol type="a">
          <li>sabão</li>
          <li>detergente</li>
          <li>desinfetante</li>
        </ol>
      </li>
    </ul>
  </body>
</html>
